<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Emploi Dashboard{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <style>
        :root {
            --bg: #f5f5f5; --card-bg: white; --text: #333; --text-muted: #666;
            --border: #ddd; --primary: #1a1a2e; --primary-hover: #16213e;
            --green: #27ae60; --yellow: #f39c12; --red: #e74c3c;
            --nav-bg: #0f0f23;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a2e; --card-bg: #16213e; --text: #e0e0e0; --text-muted: #999;
                --border: #333; --primary: #e0e0e0; --primary-hover: #ccc;
                --nav-bg: #0a0a18;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
        .nav { background: var(--nav-bg); color: white; padding: 0 1.5rem; display: flex; align-items: center; gap: 0.3rem; overflow-x: auto; }
        .nav-brand { font-weight: 700; font-size: 1.1rem; padding: 0.8rem 1rem 0.8rem 0; margin-right: 0.5rem; border-right: 1px solid rgba(255,255,255,0.2); white-space: nowrap; }
        .nav a { color: rgba(255,255,255,0.7); text-decoration: none; padding: 0.8rem 0.7rem; font-size: 0.85rem; white-space: nowrap; transition: color 0.15s; }
        .nav a:hover, .nav a.active { color: white; background: rgba(255,255,255,0.1); }
        .header { background: var(--primary); color: white; padding: 1.2rem 2rem; }
        .header h1 { font-size: 1.4rem; }
        .header .stats { display: flex; gap: 1.2rem; margin-top: 0.5rem; font-size: 0.85rem; opacity: 0.8; flex-wrap: wrap; }
        .stat-card { background: rgba(255,255,255,0.1); padding: 0.2rem 0.6rem; border-radius: 6px; }
        .stat-card .num { font-weight: 700; font-size: 1.05rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        @media (max-width: 768px) { .nav { flex-wrap: nowrap; } .container { padding: 1rem; } }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="nav">
        <span class="nav-brand">📋 Emploi</span>
        <a href="/" class="{% if active_page == 'offers' %}active{% endif %}">Offres</a>
        <a href="/applications" class="{% if active_page == 'applications' %}active{% endif %}">Candidatures</a>
        <a href="/actions" class="{% if active_page == 'actions' %}active{% endif %}">Actions</a>
        <a href="/stats" class="{% if active_page == 'stats' %}active{% endif %}">Stats</a>
        <a href="/map" class="{% if active_page == 'map' %}active{% endif %}">Carte</a>
        <a href="/profiles" class="{% if active_page == 'profiles' %}active{% endif %}">Config</a>
        <a href="/health" class="{% if active_page == 'health' %}active{% endif %}">Health</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
